{% extends "layout.html" %}
{% block content %}
<div class="row">
    <div class="col-md-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-success text-white fw-bold">Nueva Reserva</div>
            <div class="card-body">
                <form action="/reservas/guardar" method="POST">
                    <input type="number" name="id_cliente" class="form-control mb-2" placeholder="ID Cliente (Persona)" required>
                    <input type="number" name="numero_h" class="form-control mb-2" placeholder="Número Habitación" required>
                    <label class="small">Fecha Llegada:</label>
                    <input type="date" name="fecha_llegada" class="form-control mb-2" required>
                    <label class="small">Fecha Salida:</label>
                    <input type="date" name="fecha_salida" class="form-control mb-2" required>
                    <input type="number" step="0.01" name="valor_reserva" class="form-control mb-2" placeholder="Valor Total" required>
                    <input type="number" name="tiempo_maxc" class="form-control mb-2" placeholder="Tiempo Max. (minutos)" required>
                    <button type="submit" class="btn btn-success w-100">Confirmar Reserva</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-8">
        <div class="bg-white p-3 rounded shadow-sm">
            <table class="table table-sm">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Hab.</th>
                        <th>Entrada</th>
                        <th>Salida</th>
                        <th>Valor</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody>
                    {% for r in lista %}
                    <tr>
                        <td>{{ r.id_reserva }}</td>
                        <td>{{ r.id_cliente }}</td>
                        <td>{{ r.numero_h }}</td>
                        <td>{{ r.fecha_llegada }}</td>
                        <td>{{ r.fecha_salida }}</td>
                        <td>${{ r.valor_reserva }}</td>
                        <td><a href="/eliminar/reserva/{{ r.id_reserva }}" class="text-danger">Eliminar</a></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
