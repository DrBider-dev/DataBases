{% extends "layout.html" %}
{% block content %}
<div class="row">
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">Nueva Habitación</div>
            <div class="card-body">
                <form action="/habitaciones/guardar" method="POST">
                    <input type="number" name="numero_h" class="form-control mb-2" placeholder="Número de Habitación" required>
                    <select name="tipo" class="form-select mb-2">
                        <option value="Sencilla">Sencilla</option>
                        <option value="Doble">Doble</option>
                        <option value="Suite">Suite</option>
                    </select>
                    <select name="estado" class="form-select mb-2">
                        <option value="Disponible">Disponible</option>
                        <option value="Ocupada">Ocupada</option>
                        <option value="Mantenimiento">Mantenimiento</option>
                    </select>
                    <input type="number" step="0.01" name="precio_noche" class="form-control mb-2" placeholder="Precio por Noche" required>
                    <button type="submit" class="btn btn-dark w-100">Registrar</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-8">
        <table class="table bg-white p-3 rounded shadow-sm">
            <thead>
                <tr>
                    <th>Número</th>
                    <th>Tipo</th>
                    <th>Estado</th>
                    <th>Precio</th>
                </tr>
            </thead>
            <tbody>
                {% for h in lista %}
                <tr>
                    <td>{{ h.numero_h }}</td>
                    <td><span class="badge bg-info">{{ h.tipo }}</span></td>
                    <td>{{ h.estado }}</td>
                    <td>${{ h.precio_noche }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
