<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Hotel Management DAO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">🏨 Hotel</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/personas">Personas</a>
                <a class="nav-link" href="/telefonos">Teléfonos</a>
                <a class="nav-link" href="/clientes">Clientes</a>
                <a class="nav-link" href="/empleados">Empleados</a>
                <a class="nav-link" href="/habitaciones">Habitaciones</a>
                <a class="nav-link" href="/reservas">Reservas</a>
                <a class="nav-link" href="/servicios">Servicios</a>
                <a class="nav-link" href="/consumos">Consumos</a>
            </div>
        </div>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
